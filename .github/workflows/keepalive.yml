# Проверка, что сайт жив (сервер ps.kz). Если сайт не ответил — шаг падает,
# и GitHub присылает владельцу письмо о проваленном запуске.
name: keepalive

on:
  schedule:
    - cron: "7 */3 * * *"   # раз в 3 часа: в приватном репозитории минуты Actions ограничены
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 30 https://inclusivecity.uk/api/health; then
              echo; echo "site is up"; exit 0
            fi
            sleep 20
          done
          echo "site is down"; exit 1
