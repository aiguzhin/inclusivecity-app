services:
  - type: web
    name: inclusivecity
    env: node
    plan: starter   # $7/мес: не засыпает и не тратит бесплатные часы аккаунта
    buildCommand: echo "no dependencies to install"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_TOKEN
        sync: false
      # Вход и регистрация (Supabase → Project Settings → API)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # ИИ-помощник Серік (console.anthropic.com → API Keys)
      - key: ANTHROPIC_API_KEY
        sync: false
      # Фото и отзывы заведений (Google Cloud → Places API (New) → ключ)
      - key: GOOGLE_PLACES_KEY
        sync: false
    # На бесплатном плане Render постоянный диск недоступен — данные и фото
    # обнуляются при каждом передеплое/перезапуске. Чтобы это исправить,
    # перейдите на платный план и раскомментируйте блок ниже:
    # disk:
    #   name: inclusivecity-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
